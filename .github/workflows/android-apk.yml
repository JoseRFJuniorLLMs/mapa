name: Android debug APK
on:
  push:
    branches: [main, master, 'feat/geotimeline-2026-android']
    paths:
      - 'GeoTimeline2026/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'GeoTimeline2026/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: GeoTimeline2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GeoTimeline2026-debug-apk
          path: GeoTimeline2026/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error